# ============================================================
# 五、计算规则
# ============================================================

[计算规则]
综合单价 = 劳务单价 + 材料单价 + 机械单价
分项合价 = 工程量 × 综合单价
直接费 = ∑分项合价
管理费 = 直接费 × 管理费率
利润 = (直接费 + 管理费) × 利润率
税前造价 = 直接费 + 管理费 + 利润
税金 = 税前造价 × 增值税率
投标总价 = 税前造价 + 税金
投标总价_含风险 = 投标总价 × 风险系数
